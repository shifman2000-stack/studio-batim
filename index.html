<!doctype html>
<!-- lang only, deliberately no dir. Every surface already sets its own
     direction (the portal in ClientPortal.css, each staff screen on its
     own root, the PDF routes in .qp-pages .page), so a global dir="rtl"
     would change nothing we own — but it WOULD inherit into the Google
     Sign-In button on the login screen, which we don't own. -->
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio Batim</title>

    <!-- PWA: manifest + the colour the OS paints around the app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F7F5F2" />

    <!-- Icons. SVG first for browsers that take it (stays crisp at any
         size), PNGs as the fallback. apple-touch-icon is what iOS uses
         for "הוסף למסך הבית" — it does not read the manifest. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="סטודיו בתים" />

    <!-- ── Early capture of `beforeinstallprompt` ──────────────────────
         This MUST be an inline classic script in <head>. It runs during
         HTML parsing, whereas the app bundle is a module (deferred) and
         React only attaches its own listener from a useEffect — which
         on /client does not run until ClientRoute has finished TWO
         sequential Supabase round-trips (getSession, then client_users).
         Chrome fires beforeinstallprompt within a few hundred ms of
         load, the event is neither sticky nor replayed, so by the time
         React was listening it had already been missed and the install
         button never appeared.

         So we catch it here, at the earliest moment possible, suppress
         the browser's own banner, and stash it for the hook to pick up
         on mount. The custom event covers the opposite ordering, where
         React mounts first and the browser fires later. -->
    <script>
      (function () {
        window.__sbInstall = {
          event: null,          // the saved BeforeInstallPromptEvent
          firedAt: null,        // when the browser offered it
          capturedEarly: false, // true = this script caught it, not React
          installed: false,
        }
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault()
          window.__sbInstall.event = e
          window.__sbInstall.firedAt = Date.now()
          window.__sbInstall.capturedEarly = true
          window.dispatchEvent(new Event('sb-install-available'))
        })
        window.addEventListener('appinstalled', function () {
          window.__sbInstall.event = null
          window.__sbInstall.installed = true
          window.dispatchEvent(new Event('sb-install-available'))
        })
      })()
    </script>

    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
