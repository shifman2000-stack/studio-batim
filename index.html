<!doctype html>
<!-- lang only, deliberately no dir. Every surface already sets its own
     direction (the portal in ClientPortal.css, each staff screen on its
     own root, the PDF routes in .qp-pages .page), so a global dir="rtl"
     would change nothing we own — but it WOULD inherit into the Google
     Sign-In button on the login screen, which we don't own. -->
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio Batim</title>

    <!-- PWA: manifest + the colour the OS paints around the app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F7F5F2" />

    <!-- Icons. SVG first for browsers that take it (stays crisp at any
         size), PNGs as the fallback. apple-touch-icon is what iOS uses
         for "הוסף למסך הבית" — it does not read the manifest. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="סטודיו בתים" />

    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
