<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F5F2" />
    <title>אין חיבור לאינטרנט — סטודיו בתים</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0; padding: 0; min-height: 100%;
        background: #F7F5F2; color: #1a1a18;
        font-family: 'Heebo', system-ui, -apple-system, sans-serif;
      }
      .wrap {
        min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        padding: 24px; box-sizing: border-box; text-align: center;
      }
      .icon { width: 88px; height: 88px; margin-bottom: 22px; }
      h1 { margin: 0 0 10px; font-size: 20px; font-weight: 500; }
      p  { margin: 0 0 24px; font-size: 15px; line-height: 1.7; color: #4a4a48; max-width: 320px; }
      button {
        background: #7a9478; color: #fff; border: 1px solid #5d7259;
        border-radius: 8px; padding: 10px 26px;
        font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer;
      }
      button:active { background: #5d7259; }
      .hint { margin-top: 18px; font-size: 12.5px; color: #8a8680; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <svg class="icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g fill="none" stroke="#7a9478" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 47 L50 26 L78 47"/>
          <path d="M30 47 L30 74 L70 74 L70 47"/>
        </g>
      </svg>

      <h1>אין חיבור לאינטרנט</h1>
      <p>
        לא הצלחנו לטעון את התוכן. בדקו את החיבור לרשת ונסו שוב —
        כל המידע שלכם ממתין ברגע שהחיבור יחזור.
      </p>

      <button type="button" onclick="location.reload()">נסו שוב</button>

      <div class="hint">סטודיו בתים</div>
    </div>

    <script>
      /* Reload by itself the moment connectivity returns, so nobody is
         left staring at this page after the network is already back. */
      window.addEventListener('online', () => location.reload())
    </script>
  </body>
</html>
